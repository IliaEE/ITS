name: ImageTools
options:
  bundleIdPrefix: com.wottaapp
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: NH5YK4W96C
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.56.0
targets:
  ImageTools:
    type: application
    platform: iOS
    sources:
      - path: ImageTools
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: PostHog
        product: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wottaapp.imagetools
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ImageTools/Info.plist
      properties:
        CFBundleDisplayName: Image Tools
        UILaunchScreen: { UIColorName: "" }
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Image Tools saves processed photos to your library.
        UIAppFonts:
          - Inter_400Regular.ttf
          - Inter_500Medium.ttf
          - Inter_600SemiBold.ttf
          - Inter_700Bold.ttf
        UIViewControllerBasedStatusBarAppearance: true
schemes:
  ImageTools:
    build:
      targets:
        ImageTools: all
    run:
      config: Debug
    archive:
      config: Release
